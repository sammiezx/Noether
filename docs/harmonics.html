<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spherical Harmonics</title>
<style>
  :root {
    --bg: #05070d; --panel: rgba(10,16,28,0.8); --border: #1d2b44;
    --accent: #38e1ff; --text: #cbd5e1; --muted: #6b7d99;
    --pos: #ff6b5e; --neg: #4aa3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .grid-bg { position: fixed; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(56,225,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,225,255,0.05) 1px, transparent 1px);
    background-size: 44px 44px; mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 80%); }

  header { position: fixed; top: 22px; left: 28px; z-index: 5; }
  h1 { margin: 0; font-size: 15px; letter-spacing: 8px; font-weight: 600;
    color: var(--accent); text-shadow: 0 0 18px rgba(56,225,255,0.5); }
  .sub { margin-top: 4px; font-size: 11px; letter-spacing: 3px; color: var(--muted); }

  .panel { position: fixed; top: 22px; right: 24px; z-index: 5; width: 296px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px 18px; backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  .ymath { text-align: center; font-size: 30px; margin: 2px 0 4px;
    font-family: "Times New Roman", Georgia, serif; color: #fff; }
  .ymath sub, .ymath sup { font-size: 16px; }
  .desc { text-align: center; font-size: 11.5px; color: var(--muted); min-height: 28px;
    line-height: 1.45; margin-bottom: 12px; }
  .row { margin: 11px 0; }
  .row label { display: flex; justify-content: space-between; font-size: 11px;
    letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .row label b { color: var(--accent); font-size: 13px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select { width: 100%; padding: 8px; background: rgba(56,225,255,0.06); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; font-size: 12px; }
  .btns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .btns button { flex: 1 1 30%; padding: 8px 4px; font-size: 10.5px; cursor: pointer;
    background: rgba(56,225,255,0.06); color: var(--text); white-space: nowrap;
    border: 1px solid var(--border); border-radius: 8px; letter-spacing: 1px; }
  .btns button.on { background: rgba(56,225,255,0.18); border-color: var(--accent); color: #fff; }
  .sectlabel { font-size: 10px; letter-spacing: 2px; color: var(--muted);
    text-transform: uppercase; margin: 14px 0 2px; }
  .legend { display: flex; justify-content: center; gap: 16px; margin-top: 14px;
    font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 11px; height: 11px; border-radius: 3px; }
  .huebar { width: 92px; height: 11px; border-radius: 3px;
    background: linear-gradient(90deg,#ff004c,#ffea00,#00ff6e,#00b3ff,#7a00ff,#ff004c); }
  .hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: 2px; color: var(--muted); z-index: 5; }
</style>
<script type="importmap">
  { "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
  <div class="grid-bg"></div>
  <canvas id="c"></canvas>

  <a href="index.html" style="position:fixed;top:22px;left:28px;z-index:6;font-size:12px;letter-spacing:2px;color:#6b7d99;text-decoration:none">‹ PHYSIK</a>
  <header style="top:48px">
    <h1>SPHERICAL&nbsp;HARMONICS</h1>
    <div class="sub">Y&#8343;&#7504;(θ, φ) &nbsp;·&nbsp; THE SHAPE OF ANGULAR MOMENTUM</div>
  </header>

  <div class="panel">
    <div class="ymath" id="ymath">Y<sub>3</sub><sup>2</sup></div>
    <div class="desc" id="desc"></div>

    <div class="row">
      <label>Degree &nbsp;ℓ <b id="lval">3</b></label>
      <input type="range" id="l" min="0" max="10" step="1" value="3" />
    </div>
    <div class="row">
      <label>Order &nbsp;m <b id="mval">2</b></label>
      <input type="range" id="m" min="-3" max="3" step="1" value="2" />
    </div>

    <div class="row">
      <select id="preset">
        <option value="">— jump to a known one —</option>
        <option value="0,0">s orbital · Y₀⁰</option>
        <option value="1,0">p_z · Y₁⁰</option>
        <option value="1,1">p_x · Y₁¹</option>
        <option value="2,0">d_z² · Y₂⁰</option>
        <option value="2,-2">d_xy · Y₂⁻²</option>
        <option value="3,0">f_z³ · Y₃⁰</option>
        <option value="4,2">ℓ4 m2 · flower</option>
        <option value="6,4">ℓ6 m4</option>
        <option value="8,8">ℓ8 m8 · beach ball</option>
      </select>
    </div>

    <div class="sectlabel">Representation</div>
    <div class="btns">
      <button id="mode-lobes" class="on">|Y| LOBES</button>
      <button id="mode-sphere">SPHERE MAP</button>
      <button id="mode-phase">PHASE</button>
    </div>

    <div class="sectlabel">Options</div>
    <div class="btns">
      <button class="toggle" id="t-density">|Y|² DENSITY</button>
      <button class="toggle" id="t-axes">AXES</button>
      <button class="toggle" id="t-animate">ANIMATE</button>
    </div>
    <div class="btns">
      <button class="toggle on" id="t-rotate">AUTO-ROTATE</button>
      <button class="toggle" id="t-wire">WIREFRAME</button>
    </div>

    <div class="legend" id="legend"></div>
  </div>

  <div class="hint">drag to orbit · scroll to zoom</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---------------------------------------------------------------------------
// Real / complex spherical harmonics
// ---------------------------------------------------------------------------
function factorial(n) { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }

// Associated Legendre P_l^m(x), m >= 0 (Numerical Recipes recurrence).
function plgndr(l, m, x) {
  let pmm = 1;
  if (m > 0) {
    const somx2 = Math.sqrt((1 - x) * (1 + x));
    let fact = 1;
    for (let i = 1; i <= m; i++) { pmm *= -fact * somx2; fact += 2; }
  }
  if (l === m) return pmm;
  let pmmp1 = x * (2 * m + 1) * pmm;
  if (l === m + 1) return pmmp1;
  let pll = 0;
  for (let ll = m + 2; ll <= l; ll++) {
    pll = (x * (2 * ll - 1) * pmmp1 - (ll + m - 1) * pmm) / (ll - m);
    pmm = pmmp1; pmmp1 = pll;
  }
  return pll;
}
function shNorm(l, am) {
  return Math.sqrt((2 * l + 1) / (4 * Math.PI) * factorial(l - am) / factorial(l + am));
}
// Real spherical harmonic Y_l^m(theta, phi).
function realSH(l, m, theta, phi) {
  const am = Math.abs(m);
  const base = shNorm(l, am) * plgndr(l, am, Math.cos(theta));
  if (m > 0) return Math.SQRT2 * base * Math.cos(am * phi);
  if (m < 0) return Math.SQRT2 * base * Math.sin(am * phi);
  return base;
}
// Magnitude of the complex Y_l^m (|e^{imφ}| = 1 → independent of φ).
function complexMag(l, m, theta) {
  const am = Math.abs(m);
  return Math.abs(shNorm(l, am) * plgndr(l, am, Math.cos(theta)));
}

// ---------------------------------------------------------------------------
// Three.js scene
// ---------------------------------------------------------------------------
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(4.6, 3.2, 4.6);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 3;
controls.maxDistance = 18;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(4, 6, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0x66ccff, 0.6); rim.position.set(-5, -2, -4); scene.add(rim);

const axes = new THREE.AxesHelper(2.6);
axes.visible = false;
scene.add(axes);

const POS = new THREE.Color("#ff6b5e");
const NEG = new THREE.Color("#4aa3ff");
const DARK = new THREE.Color(0x0a0f1a);

const material = new THREE.MeshPhongMaterial({
  vertexColors: true, shininess: 28, specular: 0x223344, side: THREE.DoubleSide,
});
let mesh = null;

const TH = 128, PH = 256;
let state = { l: 3, m: 2, mode: "lobes", density: false, animate: false };

// Cached per-vertex data for cheap phase recolouring during animation.
let phiArr = null, magArr = null;

function buildMesh() {
  const { l, m, mode, density } = state;
  const verts = (TH + 1) * (PH + 1);
  const positions = new Float32Array(verts * 3);
  const colors = new Float32Array(verts * 3);
  phiArr = new Float32Array(verts);
  magArr = new Float32Array(verts);

  // sample + find max magnitude for normalisation
  const Y = new Float32Array(verts);
  let maxAbs = 1e-9;
  let idx = 0;
  for (let i = 0; i <= TH; i++) {
    const theta = (i / TH) * Math.PI;
    for (let j = 0; j <= PH; j++) {
      const phi = (j / PH) * 2 * Math.PI;
      const v = (mode === "phase") ? complexMag(l, m, theta) : realSH(l, m, theta, phi);
      Y[idx] = v; phiArr[idx] = phi;
      const a = Math.abs(v);
      if (a > maxAbs) maxAbs = a;
      idx++;
    }
  }

  idx = 0;
  const c = new THREE.Color();
  for (let i = 0; i <= TH; i++) {
    const theta = (i / TH) * Math.PI;
    const st = Math.sin(theta), ct = Math.cos(theta);
    for (let j = 0; j <= PH; j++) {
      const phi = (j / PH) * 2 * Math.PI;
      const dx = st * Math.cos(phi), dy = ct, dz = st * Math.sin(phi); // y-up
      let norm = Y[idx] / maxAbs;                 // [-1,1] (>=0 for phase)
      let mag = Math.abs(norm);
      if (density) mag = mag * mag;               // |Y|² probability density
      magArr[idx] = mag;

      let R = (mode === "sphere") ? 1.5 : 0.12 + 1.55 * mag;
      positions[idx * 3] = dx * R;
      positions[idx * 3 + 1] = dy * R;
      positions[idx * 3 + 2] = dz * R;

      if (mode === "phase") {
        c.setHSL(((m * phi) / (2 * Math.PI)) % 1, 0.85, 0.55);
      } else {
        const t = Math.min(1, mag);
        c.copy(norm >= 0 ? POS : NEG).lerp(DARK, 1 - (0.35 + 0.65 * t));
      }
      colors[idx * 3] = c.r; colors[idx * 3 + 1] = c.g; colors[idx * 3 + 2] = c.b;
      idx++;
    }
  }

  const indices = [];
  const row = PH + 1;
  for (let i = 0; i < TH; i++) {
    for (let j = 0; j < PH; j++) {
      const a = i * row + j, b = a + 1, d = a + row, e = d + 1;
      indices.push(a, d, b, b, d, e);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  if (mesh) { mesh.geometry.dispose(); mesh.geometry = geo; }
  else { mesh = new THREE.Mesh(geo, material); scene.add(mesh); }
}

// Recolour phase hue over time (the e^{imφ} winding rotating = angular momentum).
function recolorPhase(offset) {
  if (!mesh || state.mode !== "phase" || !phiArr) return;
  const attr = mesh.geometry.getAttribute("color");
  const arr = attr.array;
  const c = new THREE.Color();
  for (let k = 0; k < phiArr.length; k++) {
    c.setHSL(((state.m * phiArr[k] + offset) / (2 * Math.PI)) % 1, 0.85, 0.55);
    arr[k * 3] = c.r; arr[k * 3 + 1] = c.g; arr[k * 3 + 2] = c.b;
  }
  attr.needsUpdate = true;
}

// ---------------------------------------------------------------------------
function describe(l, m) {
  const names = {
    "0,0": "The monopole — perfectly uniform. (An s orbital.)",
    "1,0": "A dumbbell along z — the p_z orbital.",
    "1,1": "p orbital in the xy-plane.",
    "2,0": "The d_z² orbital — lobes plus a ring.",
    "2,2": "Cloverleaf in the xy-plane — a d orbital.",
    "3,0": "An f-type harmonic stacked along z.",
  };
  const k = `${l},${Math.abs(m)}`;
  if (names[k]) return names[k];
  if (m === 0) return `Axially symmetric about z, with ${l} latitude bands.`;
  return `${l - Math.abs(m)} latitude bands × ${Math.abs(m)} longitude waves.`;
}

// ---------------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------------
const lSlider = document.getElementById("l");
const mSlider = document.getElementById("m");
const lval = document.getElementById("lval");
const mval = document.getElementById("mval");
const ymath = document.getElementById("ymath");
const desc = document.getElementById("desc");
const legend = document.getElementById("legend");
const preset = document.getElementById("preset");

function updateLegend() {
  if (state.mode === "phase") {
    legend.innerHTML = '<span><i class="huebar"></i> complex phase (e<sup>imφ</sup>)</span>';
  } else {
    legend.innerHTML =
      '<span><i class="dot" style="background:var(--pos)"></i> Y &gt; 0</span>' +
      '<span><i class="dot" style="background:var(--neg)"></i> Y &lt; 0</span>';
  }
}

function refresh() {
  const l = +lSlider.value;
  mSlider.min = -l; mSlider.max = l;
  let m = Math.max(-l, Math.min(l, +mSlider.value));
  mSlider.value = m;
  state.l = l; state.m = m;
  lval.textContent = l;
  mval.textContent = m;
  ymath.innerHTML = `Y<sub>${l}</sub><sup>${m}</sup>`;
  desc.textContent = describe(l, m);
  updateLegend();
  buildMesh();
}

lSlider.addEventListener("input", refresh);
mSlider.addEventListener("input", refresh);
preset.addEventListener("change", () => {
  if (!preset.value) return;
  const [pl, pm] = preset.value.split(",").map(Number);
  lSlider.value = pl; mSlider.min = -pl; mSlider.max = pl; mSlider.value = pm;
  preset.value = "";
  refresh();
});

function modeButton(id, mode) {
  document.getElementById(id).addEventListener("click", () => {
    state.mode = mode;
    for (const b of ["mode-lobes", "mode-sphere", "mode-phase"])
      document.getElementById(b).classList.toggle("on", b === id);
    updateLegend();
    buildMesh();
  });
}
modeButton("mode-lobes", "lobes");
modeButton("mode-sphere", "sphere");
modeButton("mode-phase", "phase");

function toggle(id, onClick) {
  const el = document.getElementById(id);
  el.addEventListener("click", () => { el.classList.toggle("on"); onClick(el.classList.contains("on")); });
}
toggle("t-density", (on) => { state.density = on; buildMesh(); });
toggle("t-axes", (on) => { axes.visible = on; });
toggle("t-animate", (on) => { state.animate = on; });
toggle("t-rotate", (on) => { controls.autoRotate = on; });
toggle("t-wire", (on) => { material.wireframe = on; });
document.getElementById("t-rotate").classList.add("on");

// ---------------------------------------------------------------------------
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();
refresh();

let phase = 0;
renderer.setAnimationLoop((tms) => {
  controls.update();
  if (state.animate && state.mode === "phase") {
    phase += 0.03;
    recolorPhase(phase);
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
