<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quantum States — Physik</title>
<style>
  :root { --bg:#05070d; --panel:rgba(10,16,28,0.82); --border:#1d2b44; --accent:#38e1ff; --text:#cbd5e1; --muted:#6b7d99; --pos:#ff6b5e; --neg:#4aa3ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,system-ui,"Segoe UI",sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  .grid-bg { position:fixed; inset:0; pointer-events:none;
    background-image:linear-gradient(rgba(56,225,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(56,225,255,.05) 1px,transparent 1px);
    background-size:44px 44px; mask-image:radial-gradient(circle at 50% 50%,#000 30%,transparent 80%); }
  a.back { position:fixed; top:22px; left:28px; z-index:6; font-size:12px; letter-spacing:2px; color:var(--muted); text-decoration:none; }
  header { position:fixed; top:48px; left:28px; z-index:5; }
  h1 { margin:0; font-size:15px; letter-spacing:7px; font-weight:600; color:var(--accent); text-shadow:0 0 18px rgba(56,225,255,.5); }
  .sub { margin-top:4px; font-size:11px; letter-spacing:3px; color:var(--muted); }

  .panel { position:fixed; top:22px; right:24px; z-index:5; width:300px; background:var(--panel);
    border:1px solid var(--border); border-radius:14px; padding:16px 18px 18px; backdrop-filter:blur(10px); box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .orb { text-align:center; font-size:30px; margin:2px 0 2px; font-family:"Times New Roman",Georgia,serif; color:#fff; }
  .orb sub { font-size:15px; }
  .desc { text-align:center; font-size:11.5px; color:var(--muted); min-height:30px; line-height:1.45; margin-bottom:12px; }
  .row { margin:12px 0; }
  .row label { display:flex; justify-content:space-between; font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:7px; }
  .row label b { color:var(--accent); font-size:13px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  select { width:100%; padding:8px; background:rgba(56,225,255,.06); color:var(--text); border:1px solid var(--border); border-radius:8px; font-size:12px; }
  .btns { display:flex; gap:6px; margin-top:10px; }
  .btns button { flex:1; padding:8px 6px; font-size:11px; cursor:pointer; background:rgba(56,225,255,.06); color:var(--text); border:1px solid var(--border); border-radius:8px; letter-spacing:1px; }
  .btns button.on { background:rgba(56,225,255,.18); border-color:var(--accent); color:#fff; }
  .legend { display:flex; justify-content:center; gap:18px; margin-top:14px; font-size:11px; color:var(--muted); }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:11px; height:11px; border-radius:3px; }
  .note { font-size:10.5px; color:var(--muted); text-align:center; margin-top:12px; line-height:1.5; }
  .hint { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:2px; color:var(--muted); z-index:5; }
</style>
<script type="importmap">
  { "imports": { "three":"https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
  <div class="grid-bg"></div>
  <canvas id="c"></canvas>
  <a class="back" href="index.html">‹ PHYSIK</a>
  <header><h1>QUANTUM STATES</h1><div class="sub">ψₙₗₘ(r,θ,φ) &nbsp;·&nbsp; THE HYDROGEN ATOM</div></header>

  <div class="panel">
    <div class="orb" id="orb">1s</div>
    <div class="desc" id="desc"></div>
    <select id="preset">
      <option value="">— jump to an orbital —</option>
      <option value="1,0,0">1s — the ground state</option>
      <option value="2,0,0">2s — one radial node</option>
      <option value="2,1,0">2p_z — first p orbital</option>
      <option value="3,1,0">3p_z</option>
      <option value="3,2,0">3d_z²</option>
      <option value="3,2,2">3d (m=2)</option>
      <option value="4,3,0">4f</option>
      <option value="4,2,1">4d (m=1)</option>
    </select>
    <div class="row"><label>Principal &nbsp;n <b id="nval">1</b></label><input type="range" id="n" min="1" max="5" step="1" value="1"></div>
    <div class="row"><label>Azimuthal &nbsp;ℓ <b id="lval">0</b></label><input type="range" id="l" min="0" max="0" step="1" value="0"></div>
    <div class="row"><label>Magnetic &nbsp;m <b id="mval">0</b></label><input type="range" id="m" min="0" max="0" step="1" value="0"></div>
    <div class="btns">
      <button class="toggle on" id="t-rotate">AUTO-ROTATE</button>
      <button class="toggle" id="t-axes">AXES</button>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:var(--pos)"></i> ψ &gt; 0</span>
      <span><i class="dot" style="background:var(--neg)"></i> ψ &lt; 0</span>
    </div>
    <div class="note">A cloud of points sampled by |ψ|² — denser where the electron is more likely to be. Colored by the sign of ψ.</div>
  </div>
  <div class="hint">drag to orbit · scroll to zoom</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// ---- hydrogen wavefunction (a0 = 1) ----
function fact(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
function plgndr(l,m,x){let pmm=1;if(m>0){const s=Math.sqrt((1-x)*(1+x));let f=1;for(let i=1;i<=m;i++){pmm*=-f*s;f+=2;}}if(l===m)return pmm;let p1=x*(2*m+1)*pmm;if(l===m+1)return p1;let pll=0;for(let ll=m+2;ll<=l;ll++){pll=(x*(2*ll-1)*p1-(ll+m-1)*pmm)/(ll-m);pmm=p1;p1=pll;}return pll;}
function realSH(l,m,theta,phi){const am=Math.abs(m);const N=Math.sqrt((2*l+1)/(4*Math.PI)*fact(l-am)/fact(l+am));const P=N*plgndr(l,am,Math.cos(theta));if(m>0)return Math.SQRT2*P*Math.cos(am*phi);if(m<0)return Math.SQRT2*P*Math.sin(am*phi);return P;}
// associated Laguerre L_k^a(x)
function laguerre(k,a,x){if(k<0)return 0;if(k===0)return 1;let Lm=1,Lc=1+a-x;for(let i=1;i<k;i++){const Lp=((2*i+1+a-x)*Lc-(i+a)*Lm)/(i+1);Lm=Lc;Lc=Lp;}return Lc;}
function Rnl(n,l,r){const rho=2*r/n;const norm=Math.sqrt(Math.pow(2/n,3)*fact(n-l-1)/(2*n*fact(n+l)));return norm*Math.exp(-r/n)*Math.pow(rho,l)*laguerre(n-l-1,2*l+1,rho);}
function psi(n,l,m,x,y,z){const r=Math.sqrt(x*x+y*y+z*z);if(r<1e-7)return l===0?Rnl(n,0,0)*realSH(0,0,0,0):0;const th=Math.acos(Math.max(-1,Math.min(1,z/r)));const ph=Math.atan2(y,x);return Rnl(n,l,r)*realSH(l,m,th,ph);}

// ---- scene ----
const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,1,0.1,200); camera.position.set(10,7,14);
const controls=new OrbitControls(camera,canvas); controls.enableDamping=true; controls.autoRotate=true; controls.autoRotateSpeed=0.9; controls.minDistance=4; controls.maxDistance=80;
const axes=new THREE.AxesHelper(8); axes.visible=false; scene.add(axes);

const POS=new THREE.Color("#ff6b5e"), NEG=new THREE.Color("#4aa3ff");
let points=null;
const material=new THREE.PointsMaterial({ size:0.13, vertexColors:true, transparent:true, opacity:0.72, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true });

let state={n:1,l:0,m:0};

function boxSize(n){ return (n*n + n + 2) * 1.7; }   // physical half-extent (Bohr radii)

function build(){
  const {n,l,m}=state;
  const L=boxSize(n);
  // estimate peak |psi|^2 on a coarse grid
  let maxD=1e-12, G=20;
  for(let i=0;i<=G;i++)for(let j=0;j<=G;j++)for(let k=0;k<=G;k++){
    const p=psi(n,l,m,-L+2*L*i/G,-L+2*L*j/G,-L+2*L*k/G); const d=p*p; if(d>maxD)maxD=d;
  }
  maxD*=1.1;
  const target=24000, maxTrials=900000;
  const px=[], sgn=[]; let acc=0, tr=0;
  while(acc<target && tr<maxTrials){
    tr++;
    const x=(Math.random()*2-1)*L, y=(Math.random()*2-1)*L, z=(Math.random()*2-1)*L;
    const p=psi(n,l,m,x,y,z); const d=p*p;
    if(Math.random()*maxD < d){ px.push(x,y,z); sgn.push(p>=0?1:0); acc++; }
  }
  // robust scale-to-fit: 97th-percentile radius -> 9 units
  const rad=[]; for(let i=0;i<acc;i++){const x=px[i*3],y=px[i*3+1],z=px[i*3+2];rad.push(Math.sqrt(x*x+y*y+z*z));}
  rad.sort((a,b)=>a-b);
  const r97=rad.length?rad[Math.floor(rad.length*0.97)]||1:1;
  const s=9/(r97||1);
  const pos=new Float32Array(acc*3), col=new Float32Array(acc*3);
  for(let i=0;i<acc;i++){
    pos[i*3]=px[i*3]*s; pos[i*3+1]=px[i*3+1]*s; pos[i*3+2]=px[i*3+2]*s;
    const c=sgn[i]?POS:NEG; col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));
  g.setAttribute("color",new THREE.BufferAttribute(col,3));
  if(points){points.geometry.dispose();points.geometry=g;} else {points=new THREE.Points(g,material);scene.add(points);}
}

// ---- labels ----
const LET=["s","p","d","f","g"];
function describe(n,l,m){
  const radialNodes=n-l-1, angNodes=l;
  return `${radialNodes} radial node${radialNodes!==1?"s":""}, ${angNodes} angular node${angNodes!==1?"s":""}. Energy ∝ −1/${n}².`;
}

// ---- UI ----
const nS=document.getElementById("n"), lS=document.getElementById("l"), mS=document.getElementById("m");
const nval=document.getElementById("nval"), lval=document.getElementById("lval"), mval=document.getElementById("mval");
const orbEl=document.getElementById("orb"), descEl=document.getElementById("desc");

function refresh(rebuild=true){
  const n=+nS.value;
  lS.max=n-1; let l=Math.min(+lS.value,n-1); lS.value=l;
  mS.min=-l; mS.max=l; let m=Math.max(-l,Math.min(l,+mS.value)); mS.value=m;
  state={n,l,m};
  nval.textContent=n; lval.textContent=l; mval.textContent=m;
  orbEl.innerHTML=`${n}${LET[l]||"?"}` + (m!==0?` <sub>m=${m}</sub>`:"");
  descEl.textContent=describe(n,l,m);
  if(rebuild) build();
}
nS.addEventListener("input",()=>refresh());
lS.addEventListener("input",()=>refresh());
mS.addEventListener("input",()=>refresh());
document.getElementById("preset").addEventListener("change",e=>{
  if(!e.target.value)return; const [n,l,m]=e.target.value.split(",").map(Number);
  nS.value=n; lS.max=n-1; lS.value=l; mS.min=-l; mS.max=l; mS.value=m; e.target.value=""; refresh();
});
function toggle(id,fn){const el=document.getElementById(id);el.addEventListener("click",()=>{el.classList.toggle("on");fn(el.classList.contains("on"));});}
toggle("t-rotate",v=>controls.autoRotate=v);
toggle("t-axes",v=>axes.visible=v);
document.getElementById("t-rotate").classList.add("on");

function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener("resize",resize); resize();
refresh();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script>
</body>
</html>
