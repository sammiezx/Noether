<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spacetime &amp; Black Holes — Physik</title>
<style>
  :root { --accent:#38e1ff; --panel:rgba(10,16,28,0.82); --border:#1d2b44; --text:#cbd5e1; --muted:#6b7d99; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; color:var(--text);
    font-family:-apple-system,system-ui,"Segoe UI",sans-serif; overflow:hidden; }
  a.back { position:fixed; top:24px; left:28px; z-index:200; font-size:12px; letter-spacing:2px;
    color:var(--muted); text-decoration:none; font-family:"SF Mono",Menlo,monospace; }
  a.back:hover { color:var(--accent); }

  .panel { position:fixed; top:70px; right:24px; z-index:200; width:240px; background:var(--panel);
    border:1px solid var(--border); border-radius:14px; padding:16px 16px 18px; backdrop-filter:blur(10px);
    box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .panel .title { font-size:10px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:10px; }
  .scenes { display:flex; flex-direction:column; gap:7px; }
  .scenes button { text-align:left; padding:10px 12px; font-size:13px; cursor:pointer; color:var(--text);
    background:rgba(56,225,255,.05); border:1px solid var(--border); border-radius:9px; transition:.15s; }
  .scenes button:hover { border-color:rgba(56,225,255,.5); }
  .scenes button.on { background:rgba(56,225,255,.18); border-color:var(--accent); color:#fff; }
  .scenes button small { display:block; color:var(--muted); font-size:10.5px; letter-spacing:.5px; margin-top:2px; }
  .scenes button.on small { color:rgba(220,240,255,.6); }
  .ctl { display:flex; gap:6px; margin-top:14px; }
  .ctl button { flex:1; padding:9px 4px; font-size:12px; cursor:pointer; color:var(--text);
    background:rgba(56,225,255,.06); border:1px solid var(--border); border-radius:8px; }
  .ctl button:hover { border-color:var(--accent); }
  .ctl button.on { background:rgba(56,225,255,.18); border-color:var(--accent); color:#fff; }
  .hint { position:fixed; bottom:24px; left:0; right:0; text-align:center; z-index:200;
    font-family:"SF Mono",Menlo,monospace; font-size:11px; letter-spacing:.3em; color:rgba(220,240,255,.4); }
</style>
<link rel="stylesheet" href="spacetime.css" />
<script type="importmap">
  { "imports": { "three":"https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
  <a class="back" href="index.html">‹ PHYSIK</a>

  <!-- engine target (IDs must match spacetime.js) -->
  <div id="spacetime-overlay" class="spacetime-overlay">
    <canvas id="spacetime-canvas"></canvas>
    <div class="spacetime-hud">
      <div class="spacetime-scene-label">
        <span class="spacetime-scene-name" id="spacetime-scene-name">BLACK HOLE</span>
        <span class="spacetime-scene-sub" id="spacetime-scene-sub">SCHWARZSCHILD GEOMETRY</span>
      </div>
      <div class="spacetime-meta">
        <span id="spacetime-speed">1.0×</span><span class="dot">·</span><span id="spacetime-status">RUNNING</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="title">Scene</div>
    <div class="scenes">
      <button data-scene="blackhole" class="on">Black Hole<small>Schwarzschild horizon + accretion disk</small></button>
      <button data-scene="lightcone">Light Cones<small>Minkowski causal structure</small></button>
      <button data-scene="gravwave">Gravitational Waves<small>Binary inspiral + strain</small></button>
      <button data-scene="nbody">N-Body<small>Gravitational dynamics</small></button>
      <button data-scene="curvature">Curvature<small>Mass warping spacetime</small></button>
    </div>
    <div class="title" style="margin-top:16px">Time</div>
    <div class="ctl">
      <button id="slower">−</button>
      <button id="pause">⏸</button>
      <button id="faster">+</button>
      <button id="reset">⟳</button>
    </div>
  </div>

  <div class="hint">drag to orbit · scroll to zoom</div>

  <script type="module" src="spacetime.js"></script>
  <script type="module">
    function S(){ return window.__spacetime; }
    function act(a, extra){ const s=S(); if (s) s.handle(Object.assign({action:a}, extra||{})); }

    // open the default scene, then force a resize so the canvas fills the window
    function start(){
      if (!S()) { return setTimeout(start, 40); }
      act("open", { scene:"blackhole" });
      window.dispatchEvent(new Event("resize"));
    }
    start();

    // scene switching
    document.querySelectorAll("[data-scene]").forEach(b => b.addEventListener("click", () => {
      act("set_scene", { scene:b.dataset.scene });
      document.querySelectorAll("[data-scene]").forEach(x => x.classList.toggle("on", x === b));
    }));

    // time controls
    let speed = 1, paused = false;
    const fmt = v => Math.max(0, +v.toFixed(1));
    document.getElementById("slower").onclick = () => { speed = fmt(speed - 0.5); act("speed", { value:speed }); };
    document.getElementById("faster").onclick = () => { speed = fmt(speed + 0.5); act("speed", { value:speed }); };
    const pb = document.getElementById("pause");
    pb.onclick = () => { paused = !paused; act(paused ? "pause" : "resume"); pb.textContent = paused ? "▶" : "⏸"; pb.classList.toggle("on", paused); };
    document.getElementById("reset").onclick = () => { speed = 1; paused = false; pb.textContent = "⏸"; pb.classList.remove("on"); act("reset"); };
  </script>
</body>
</html>
