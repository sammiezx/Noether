name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Syntax-check the whole app (incl. the audio/ML modules that need a Mac
      # + on-device models to actually import).
      - name: Compile-check all sources
        run: python -m compileall -q *.py equation_viz neural_tts_server.py

      # Run the import-light core logic tests.
      - name: Install test deps
        run: pip install --quiet anthropic pytest
      - name: Run tests
        run: python -m pytest tests/ -q
